<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Glofy · Talent Profiles</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#212121;--bg2:#292929;--card:#383838;--lime:#ceff00;
  --txt:#ededed;--mut:#a8a8a8;--line:rgba(237,237,237,.11);
  --slide-ms:9000ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* Top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px 28px;background:rgba(33,33,33,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{height:26px;width:auto;display:block}
.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut);transition:.2s}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--lime);color:#212121}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.2s}
.icon-btn:hover{border-color:var(--lime);color:var(--lime)}
.icon-btn svg{width:17px;height:17px}

/* Hero */
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
.hero{padding-top:44px}
.eyebrow{color:var(--lime);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.hero h1{font-size:clamp(28px,4vw,46px);font-weight:800;line-height:1.08;margin:12px 0;letter-spacing:-.015em;max-width:900px}
.hero p{color:var(--mut);max-width:760px;font-size:16px;line-height:1.6}

/* Category chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-top:26px}
.chip{padding:9px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;gap:8px;align-items:center;transition:.2s}
.chip:hover{border-color:rgba(206,255,0,.5)}
.chip .n{font-size:11px;color:var(--mut);font-weight:700}
.chip.on{background:var(--lime);border-color:var(--lime);color:#212121}
.chip.on .n{color:#212121;opacity:.7}

main{padding-top:28px;padding-bottom:64px}

/* Slideshow */
.stage{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.progress{position:absolute;left:0;top:0;height:3px;width:0;background:var(--lime);z-index:3}
.viewport{min-height:580px;display:flex;align-items:stretch}
.slide{width:100%;display:grid;grid-template-columns:minmax(240px,400px) 1fr;gap:52px;padding:48px 56px;align-items:center;animation:slideIn .55s cubic-bezier(.2,.7,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(var(--dx,36px))}to{opacity:1;transform:none}}
.photo{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--card)}
.photo img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.avatar{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--lime);letter-spacing:-.02em;background:radial-gradient(120% 90% at 30% 15%,#474747 0%,#2f2f2f 55%,#262626 100%)}
.slide .avatar{font-size:clamp(64px,9vw,120px)}
.photo .tag{position:absolute;z-index:2;left:16px;bottom:16px;background:var(--lime);color:#212121;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border-radius:999px;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .eyebrow{display:block;margin-bottom:14px}
.info h2{font-size:clamp(34px,4.6vw,60px);font-weight:800;line-height:1;letter-spacing:-.02em}
.info .role{font-size:clamp(15px,1.5vw,19px);color:var(--mut);margin:14px 0 30px;font-weight:500;line-height:1.4}
.hl{list-style:none;display:grid;gap:14px}
.hl li{position:relative;padding-left:26px;font-size:clamp(14px,1.25vw,16px);line-height:1.55;opacity:0;animation:fadeUp .5s ease forwards}
.hl li:before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:3px;background:var(--lime)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.ctrl{display:flex;align-items:center;gap:14px;padding:16px 24px;border-top:1px solid var(--line)}
.counter{font-weight:800;font-size:14px;letter-spacing:.08em;min-width:72px;font-variant-numeric:tabular-nums}
.counter b{color:var(--lime)}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:999px;background:rgba(237,237,237,.25);transition:.3s;padding:0}
.dot:hover{background:rgba(237,237,237,.55)}
.dot.on{width:28px;background:var(--lime)}
.nav{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;transition:.2s;flex:none}
.nav:hover{background:var(--lime);color:#212121}
.nav svg{width:18px;height:18px}
.play{display:inline-flex;align-items:center;gap:8px;padding:0 14px;height:38px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.06em;transition:.2s}
.play:hover,.play.on{border-color:var(--lime);color:var(--lime)}
.play svg{width:14px;height:14px}

/* Browse */
.sec{margin-top:8px}
.sec+.sec{margin-top:34px}
.sec-h{display:flex;align-items:center;gap:12px;margin:10px 0 16px}
.sec-h h3{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:700}
.sec-h .line{flex:1;height:1px;background:var(--line)}
.sec-h .n{font-size:12px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;transition:transform .25s,border-color .25s;display:flex;flex-direction:column}
.card:hover{border-color:var(--lime);transform:translateY(-3px)}
.card .photo{aspect-ratio:4/3;border-radius:0}
.card .avatar{font-size:64px}
.card .b{padding:18px 20px 8px;flex:1}
.card h4{font-size:21px;font-weight:800;letter-spacing:-.01em}
.card .role{font-size:13px;color:var(--mut);margin:5px 0 12px;line-height:1.4}
.card .lead{font-size:13px;line-height:1.55;opacity:.88;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .more{padding:12px 20px 18px;font-size:12px;font-weight:700;color:var(--lime);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.card .more svg{width:14px;height:14px}

.state{padding:80px 20px;text-align:center;color:var(--mut);font-weight:600}

footer{border-top:1px solid var(--line);padding:22px 28px;color:var(--mut);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Present mode (fullscreen) */
body.present .top,body.present .hero-block,body.present footer{display:none}
body.present main{padding:0;max-width:none}
body.present .stage{position:fixed;inset:0;border-radius:0;border:0;display:flex;flex-direction:column;z-index:40}
body.present .viewport{flex:1}
body.present .slide{max-width:1400px;margin:0 auto;padding:56px 72px;grid-template-columns:minmax(280px,460px) 1fr;gap:72px}
.present-logo{display:none}
body.present .present-logo{display:block;position:absolute;top:26px;right:32px;height:24px;z-index:3;opacity:.9}

@media (max-width:860px){
  .top{padding:12px 16px;gap:8px;flex-wrap:wrap}
  .logo{height:22px}
  .wrap{padding:0 16px}
  .hero{padding-top:28px}
  .slide{grid-template-columns:1fr;gap:24px;padding:22px}
  .slide .photo{aspect-ratio:1/1;max-height:360px}
  .viewport{min-height:0}
  .ctrl{padding:12px 14px;gap:8px}
  .play span{display:none}
  .play{padding:0 11px}
  .dots{gap:4px}
  body.present .slide{padding:64px 22px 22px;grid-template-columns:1fr;gap:24px}
  footer{padding:20px 16px}
}
@media (prefers-reduced-motion:reduce){
  .slide,.hl li{animation:none;opacity:1}
}
</style>
</head>
<body>

<header class="top">
  <img class="logo" src="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/logo-rebrand-glofy.png" alt="Glofy">
  <div class="sp"></div>
  <div class="seg" id="viewSeg" role="group" aria-label="View">
    <button data-view="slides" class="on"></button>
    <button data-view="browse"></button>
  </div>
  <div class="seg" id="langSeg" role="group" aria-label="Language">
    <button data-lang="en" class="on">EN</button>
    <button data-lang="es">ES</button>
  </div>
  <button class="icon-btn" id="presentBtn" title="Present">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
</header>

<div class="hero-block">
  <section class="wrap hero">
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </section>
  <nav class="wrap chips" id="chips" aria-label="Categories"></nav>
</div>

<main class="wrap" id="main">
  <div class="state" id="state"></div>
</main>

<footer>
  <span>© Glofy</span>
  <span id="footNote"></span>
</footer>

<script>
const DATA_URL = 'profiles.json';
const SLIDE_MS = 9000;

const I18N = {
  en:{slides:'Slideshow',browse:'Browse',all:'All profiles',view:'View profile',loading:'Loading profiles…',
      error:'Profiles could not be loaded. Please try again later.',empty:'No profiles in this category yet.',
      play:'Autoplay',pause:'Pause',present:'Present',exit:'Exit',profiles:'profiles',profile:'profile',
      foot:'Internal use · Profiles shared for evaluation purposes only'},
  es:{slides:'Presentación',browse:'Explorar',all:'Todos los perfiles',view:'Ver perfil',loading:'Cargando perfiles…',
      error:'No se pudieron cargar los perfiles. Intentá nuevamente más tarde.',empty:'Todavía no hay perfiles en esta categoría.',
      play:'Auto',pause:'Pausa',present:'Presentar',exit:'Salir',profiles:'perfiles',profile:'perfil',
      foot:'Uso interno · Perfiles compartidos solo para evaluación'}
};

const S = {data:null,lang:'en',view:'slides',cat:'all',idx:0,playing:false,timer:null,dir:1};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t = k => I18N[S.lang][k] || I18N.en[k] || k;
const L = o => (o && (o[S.lang] || o.en)) || '';
const LA = o => { const a = o && (o[S.lang] && o[S.lang].length ? o[S.lang] : o.en); return Array.isArray(a) ? a.filter(Boolean) : []; };

/* Name rule: first name + last-name initial only, always. */
function displayName(p){
  const first = String(p.firstName || '').trim();
  const ini = String(p.lastInitial || '').replace(/[^A-Za-zÀ-ÿÑñ]/g,'').charAt(0).toUpperCase();
  return ini ? `${first} ${ini}.` : first;
}
function initials(p){
  const f = String(p.firstName || '').trim().charAt(0).toUpperCase();
  const l = String(p.lastInitial || '').trim().charAt(0).toUpperCase();
  return f + l;
}
function catById(id){ return (S.data.categories || []).find(c => c.id === id); }
function catName(id){ const c = catById(id); return c ? L(c.name) : ''; }

function visibleProfiles(){
  const cats = (S.data.categories || []).map(c => c.id);
  return (S.data.profiles || [])
    .filter(p => p.visible !== false && cats.includes(p.category))
    .map((p,i) => ({p,i}))
    .sort((a,b) => (cats.indexOf(a.p.category) - cats.indexOf(b.p.category)) || (a.i - b.i))
    .map(x => x.p);
}
function currentList(){
  const all = visibleProfiles();
  return S.cat === 'all' ? all : all.filter(p => p.category === S.cat);
}

function photoHTML(p, withTag){
  const tag = withTag ? `<span class="tag">${esc(catName(p.category))}</span>` : '';
  const av = `<div class="avatar">${esc(initials(p))}</div>`;
  if (!p.photo) return `<div class="photo">${av}${tag}</div>`;
  return `<div class="photo">${av}<img src="${esc(p.photo)}" alt="${esc(displayName(p))}" loading="lazy" onerror="this.remove()">${tag}</div>`;
}

/* ---------- Static texts ---------- */
function renderTexts(){
  document.documentElement.lang = S.lang;
  const site = S.data?.site || {};
  $('#eyebrow').textContent = L(site.eyebrow);
  $('#title').textContent = L(site.title);
  $('#subtitle').textContent = L(site.subtitle);
  $('#footNote').textContent = t('foot');
  document.querySelectorAll('#viewSeg button').forEach(b => { b.textContent = t(b.dataset.view); b.classList.toggle('on', b.dataset.view === S.view); });
  document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.lang === S.lang));
  $('#presentBtn').title = t('present');
}

function renderChips(){
  const all = visibleProfiles();
  const items = [{id:'all', label:t('all'), n:all.length}]
    .concat((S.data.categories || []).map(c => ({id:c.id, label:L(c.name), n:all.filter(p => p.category === c.id).length})).filter(c => c.n > 0));
  $('#chips').innerHTML = items.map(c =>
    `<button class="chip ${c.id === S.cat ? 'on' : ''}" data-cat="${esc(c.id)}">${esc(c.label)}<span class="n">${c.n}</span></button>`).join('');
}

/* ---------- Slideshow ---------- */
const ICON_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ICON_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

function renderSlides(){
  const list = currentList();
  if (!list.length){ $('#main').innerHTML = `<div class="state">${esc(t('empty'))}</div>`; return; }
  if (S.idx >= list.length) S.idx = 0;
  if (S.idx < 0) S.idx = list.length - 1;
  const p = list[S.idx];
  const hl = LA(p.highlights);
  const pad = n => String(n).padStart(2,'0');
  $('#main').innerHTML = `
    <section class="stage" aria-roledescription="carousel">
      <div class="progress" id="progress"></div>
      <img class="present-logo" src="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/logo-rebrand-glofy.png" alt="Glofy">
      <div class="viewport" id="viewport">
        <article class="slide" style="--dx:${S.dir * 36}px" aria-label="${esc(displayName(p))}">
          ${photoHTML(p, true)}
          <div class="info">
            <span class="eyebrow">${esc(catName(p.category))}</span>
            <h2>${esc(displayName(p))}</h2>
            <div class="role">${esc(L(p.role))}</div>
            <ul class="hl">${hl.map((h,i) => `<li style="animation-delay:${120 + i*70}ms">${esc(h)}</li>`).join('')}</ul>
          </div>
        </article>
      </div>
      <div class="ctrl">
        <span class="counter"><b>${pad(S.idx + 1)}</b> / ${pad(list.length)}</span>
        <div class="dots">${list.map((x,i) => `<button class="dot ${i === S.idx ? 'on' : ''}" data-go="${i}" aria-label="${esc(displayName(x))}"></button>`).join('')}</div>
        <button class="play ${S.playing ? 'on' : ''}" id="playBtn">${S.playing ? ICON_PAUSE : ICON_PLAY}<span>${esc(S.playing ? t('pause') : t('play'))}</span></button>
        <button class="nav" data-step="-1" aria-label="Previous">${ICON_L}</button>
        <button class="nav" data-step="1" aria-label="Next">${ICON_R}</button>
      </div>
    </section>`;
  startProgress();
}

function go(i, dir){
  const n = currentList().length; if (!n) return;
  S.dir = dir || (i > S.idx ? 1 : -1);
  S.idx = (i + n) % n;
  renderSlides(); syncURL();
}
function step(d){ go(S.idx + d, d); }

function startProgress(){
  clearTimeout(S.timer);
  const bar = $('#progress'); if (!bar) return;
  bar.style.transition = 'none'; bar.style.width = '0';
  if (!S.playing) return;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${SLIDE_MS}ms linear`; bar.style.width = '100%';
  }));
  S.timer = setTimeout(() => step(1), SLIDE_MS);
}
function togglePlay(){ S.playing = !S.playing; renderSlides(); }

/* ---------- Browse ---------- */
const ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function renderBrowse(){
  clearTimeout(S.timer);
  const list = currentList();
  if (!list.length){ $('#main').innerHTML = `<div class="state">${esc(t('empty'))}</div>`; return; }
  const cats = (S.data.categories || []).filter(c => list.some(p => p.category === c.id));
  $('#main').innerHTML = cats.map(c => {
    const ps = list.filter(p => p.category === c.id);
    return `<section class="sec">
      <div class="sec-h"><h3>${esc(L(c.name))}</h3><span class="line"></span><span class="n">${ps.length} ${esc(ps.length === 1 ? t('profile') : t('profiles'))}</span></div>
      <div class="grid">${ps.map(p => `
        <button class="card" data-open="${esc(p.id)}">
          ${photoHTML(p, false)}
          <div class="b">
            <h4>${esc(displayName(p))}</h4>
            <div class="role">${esc(L(p.role))}</div>
            <div class="lead">${esc(LA(p.highlights)[0] || '')}</div>
          </div>
          <div class="more">${esc(t('view'))} ${ICON_ARROW}</div>
        </button>`).join('')}</div>
    </section>`;
  }).join('');
}

/* ---------- Orchestration ---------- */
function render(){
  renderTexts();
  if (!S.data) return;
  renderChips();
  S.view === 'browse' ? renderBrowse() : renderSlides();
}
function syncURL(){
  const q = new URLSearchParams();
  if (S.lang !== 'en') q.set('lang', S.lang);
  if (S.view !== 'slides') q.set('view', S.view);
  if (S.cat !== 'all') q.set('cat', S.cat);
  if (S.view === 'slides'){ const p = currentList()[S.idx]; if (p && S.idx > 0) q.set('p', p.id); }
  const qs = q.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang){ S.lang = b.dataset.lang; render(); syncURL(); }
  else if (b.dataset.view){ S.view = b.dataset.view; S.playing = false; render(); syncURL(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if (b.dataset.cat){ S.cat = b.dataset.cat; S.idx = 0; S.dir = 1; render(); syncURL(); }
  else if (b.dataset.step){ step(+b.dataset.step); }
  else if (b.dataset.go){ go(+b.dataset.go); }
  else if (b.dataset.open){
    const i = currentList().findIndex(p => p.id === b.dataset.open);
    S.view = 'slides'; S.idx = Math.max(0,i); S.dir = 1; render(); syncURL();
    const y = $('#chips').getBoundingClientRect().top + window.scrollY - 70;
    window.scrollTo({top: y, behavior:'smooth'});
  }
  else if (b.id === 'playBtn'){ togglePlay(); }
  else if (b.id === 'presentBtn'){ togglePresent(); }
});

document.addEventListener('keydown', e => {
  if (S.view !== 'slides' || !S.data) return;
  if (e.key === 'ArrowRight'){ step(1); }
  else if (e.key === 'ArrowLeft'){ step(-1); }
  else if (e.key === ' ' && e.target === document.body){ e.preventDefault(); togglePlay(); }
  else if (e.key.toLowerCase() === 'f'){ togglePresent(); }
});

/* Swipe */
let tx = null;
document.addEventListener('touchstart', e => { if (e.target.closest('.viewport')) tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});

/* Present mode */
function togglePresent(){
  if (S.view !== 'slides'){ S.view = 'slides'; render(); }
  if (!document.body.classList.contains('present')){
    document.body.classList.add('present');
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el)?.catch?.(() => {});
  } else {
    document.body.classList.remove('present');
    if (document.fullscreenElement) document.exitFullscreen?.();
  }
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('present'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('present'); });

/* Init */
(async function init(){
  const q = new URLSearchParams(location.search);
  S.lang = q.get('lang') === 'es' ? 'es' : 'en';
  S.view = q.get('view') === 'browse' ? 'browse' : 'slides';
  renderTexts();
  $('#state').textContent = t('loading');
  try{
    const r = await fetch(`${DATA_URL}?v=${Date.now()}`, {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    S.data = await r.json();
  }catch(err){
    console.error(err);
    $('#main').innerHTML = `<div class="state">${esc(t('error'))}</div>`;
    return;
  }
  const cat = q.get('cat');
  if (cat && (S.data.categories || []).some(c => c.id === cat)) S.cat = cat;
  const pid = q.get('p');
  if (pid){ const i = currentList().findIndex(p => p.id === pid); if (i >= 0) S.idx = i; }
  render();
})();
</script>
</body>
</html>
